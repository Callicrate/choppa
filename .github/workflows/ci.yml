name: "CI"

"on":
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: "Check out source"
        # actions/checkout v6.1.0
        uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803"
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "Set up Python"
        # actions/setup-python v6.3.0
        uses: "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1"
        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Set up uv"
        # astral-sh/setup-uv v7.6.0
        uses: "astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78"
        with:
          version: "0.9.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Install locked dependencies"
        run: "uv sync --locked --extra dev"

      - name: "Lint"
        run: "uv run ruff check src tests scripts"

      - name: "Lint workflow YAML"
        run: "uv run yamllint .github/workflows/ci.yml .yamllint.yml"

      - name: "Audit workflow security"
        run: "uv run zizmor --pedantic .github/workflows/ci.yml"

      - name: "Lint Markdown"
        run: "uv run pymarkdownlnt -d md013 scan README.md CONTRIBUTING.md SECURITY.md"

      - name: "Check formatting"
        run: "uv run ruff format --check src tests scripts"

      - name: "Type-check"
        run: "uv run mypy src tests scripts"

      - name: "Run offline tests"
        run: "uv run pytest --cov=choppa --cov-branch --cov-fail-under=90"

  package:
    name: "Package and audit"
    needs:
      - "test"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: "Check out source"
        # actions/checkout v6.1.0
        uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803"
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "Set up Python"
        # actions/setup-python v6.3.0
        uses: "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1"
        with:
          python-version: "3.12"

      - name: "Set up uv"
        # astral-sh/setup-uv v7.6.0
        uses: "astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78"
        with:
          version: "0.9.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: "Install locked dependencies"
        run: "uv sync --locked --extra dev --python 3.12"

      - name: "Build distributions"
        run: "uv build --out-dir dist"

      - name: "Validate package metadata"
        run: "uv run twine check dist/*"

      - name: "Validate wheel contents"
        run: "uv run check-wheel-contents dist/*.whl"

      - name: "Audit dependencies"
        run: "uv run pip-audit"

      - name: "Smoke-test base wheel"
        shell: "bash"
        run: |
          uv venv --python 3.12 .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/python scripts/verify_wheel.py

      - name: "Type-check installed wheel"
        run: >-
          uv run mypy --strict --python-executable .wheel-smoke/bin/python
          scripts/typecheck_consumer.py
